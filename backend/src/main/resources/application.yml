spring:
  application:
    name: tickets-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/management_tickets?replicaSet=rs0}
      auto-index-creation: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-expiration-min: ${JWT_ACCESS_EXPIRATION_MIN:15}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
  mail:
    from: ${MAIL_FROM:no-reply@sistemasintegrados.co}
  password-reset:
    token-expiration-min: ${PASSWORD_RESET_TOKEN_EXPIRATION_MIN:30}
    url: ${PASSWORD_RESET_URL:http://localhost:5173/reset-password}
  auth:
    max-failed-attempts: ${AUTH_MAX_FAILED_ATTEMPTS:5}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
